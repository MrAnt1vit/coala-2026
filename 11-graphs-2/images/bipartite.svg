<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Двудольный граф и треугольник, который нельзя раскрасить в два цвета</title>
  <desc id="desc">Слева все рёбра проходят между синей и оранжевой группами. Справа треугольник содержит ребро между вершинами одинакового цвета.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 16px; }
    .node-label { fill: white; font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #64748b; stroke-width: 3; }
  </style>
  <rect width="900" height="330" rx="18" fill="#f8fafc"/>
  <line x1="450" y1="35" x2="450" y2="295" stroke="#cbd5e1" stroke-width="2"/>
  <text x="35" y="43" class="heading">Можно разделить на две группы</text>
  <text x="488" y="43" class="heading">Треугольник: нельзя</text>
  <rect x="51" y="75" width="125" height="198" rx="18" fill="#dbeafe"/>
  <rect x="264" y="75" width="125" height="198" rx="18" fill="#ffedd5"/>
  <line class="edge" x1="112" y1="115" x2="326" y2="115"/>
  <line class="edge" x1="112" y1="115" x2="326" y2="206"/>
  <line class="edge" x1="112" y1="185" x2="326" y2="115"/>
  <line class="edge" x1="112" y1="251" x2="326" y2="206"/>
  <circle cx="112" cy="115" r="24" fill="#2563eb"/><text x="112" y="115" class="node-label">1</text>
  <circle cx="112" cy="185" r="24" fill="#2563eb"/><text x="112" y="185" class="node-label">3</text>
  <circle cx="112" cy="251" r="24" fill="#2563eb"/><text x="112" y="251" class="node-label">5</text>
  <circle cx="326" cy="115" r="24" fill="#ea580c"/><text x="326" y="115" class="node-label">2</text>
  <circle cx="326" cy="206" r="24" fill="#ea580c"/><text x="326" y="206" class="node-label">4</text>
  <text x="88" y="307" class="label">Группа 1</text><text x="299" y="307" class="label">Группа 2</text>

  <line class="edge" x1="563" y1="138" x2="754" y2="138"/>
  <line x1="571" y1="160" x2="661" y2="250" stroke="#dc2626" stroke-width="4"/>
  <line class="edge" x1="746" y1="160" x2="672" y2="250"/>
  <circle cx="553" cy="138" r="28" fill="#2563eb"/><text x="553" y="138" class="node-label">1</text>
  <circle cx="764" cy="138" r="28" fill="#ea580c"/><text x="764" y="138" class="node-label">2</text>
  <circle cx="665" cy="266" r="28" fill="#2563eb"/><text x="665" y="266" class="node-label">3</text>
  <text x="496" y="315" class="label">Ребро 1–3 соединяет один цвет.</text>
</svg>
