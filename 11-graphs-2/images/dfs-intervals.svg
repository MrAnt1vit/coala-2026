<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Вложенные интервалы времени входа и выхода DFS</title>
  <desc id="desc">Интервал вершины 4 целиком лежит внутри интервала вершины 2, а тот внутри интервала корня 1. Интервал вершины 3 не лежит внутри интервала 2.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 16px; }
    .tick { font-size: 14px; text-anchor: middle; }
  </style>
  <rect width="900" height="340" rx="18" fill="#f8fafc"/>
  <text x="35" y="42" class="heading">Интервалы DFS в дереве</text>
  <text x="35" y="80" class="label">Вершина 1 — корень; 2 и 3 — её дети; 4 — ребёнок вершины 2.</text>
  <line x1="150" y1="280" x2="820" y2="280" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="160" y1="275" x2="160" y2="285"/><line x1="250" y1="275" x2="250" y2="285"/><line x1="340" y1="275" x2="340" y2="285"/><line x1="430" y1="275" x2="430" y2="285"/><line x1="520" y1="275" x2="520" y2="285"/><line x1="610" y1="275" x2="610" y2="285"/><line x1="700" y1="275" x2="700" y2="285"/><line x1="790" y1="275" x2="790" y2="285"/>
  </g>
  <g class="tick"><text x="160" y="308">0</text><text x="250" y="308">1</text><text x="340" y="308">2</text><text x="430" y="308">3</text><text x="520" y="308">4</text><text x="610" y="308">5</text><text x="700" y="308">6</text><text x="790" y="308">7</text></g>
  <text x="40" y="128" class="label">1</text><rect x="160" y="108" width="630" height="30" rx="8" fill="#cbd5e1"/><text x="176" y="130" class="label">[0, 7]</text>
  <text x="40" y="172" class="label">2</text><rect x="250" y="152" width="270" height="30" rx="8" fill="#93c5fd"/><text x="266" y="174" class="label">[1, 4]</text>
  <text x="40" y="216" class="label">4</text><rect x="340" y="196" width="90" height="30" rx="8" fill="#2563eb"/><text x="349" y="218" style="font: 15px Arial, sans-serif; fill: white">[2, 3]</text>
  <text x="40" y="260" class="label">3</text><rect x="610" y="240" width="90" height="30" rx="8" fill="#fdba74"/><text x="619" y="262" style="font: 15px Arial, sans-serif">[5, 6]</text>
  <text x="690" y="330" class="label">Время →</text>
</svg>
