<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="title desc">
  <title id="title">Бинарный поиск длины общего префикса</title>
  <desc id="desc">Для abacaba и aba первые 0, 1, 2, 3 символа совпадают; длина 4 невозможна, ответ 3.</desc>
  <rect width="840" height="250" rx="18" fill="#f8fafc"/>
  <text x="34" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Пример: abacaba и aba</text>
  <text x="34" y="80" font-family="Arial,sans-serif" font-size="18" fill="#334155">Проверяем длину одинакового начала</text>
  <g font-family="Arial,sans-serif" font-size="22" text-anchor="middle">
    <rect x="33" y="107" width="138" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="184" y="107" width="138" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="335" y="107" width="138" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="486" y="107" width="138" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="637" y="107" width="169" height="76" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <g fill="#0f172a"><text x="102" y="140">0</text><text x="253" y="140">1</text><text x="404" y="140">2</text><text x="555" y="140">3</text><text x="721" y="140">4</text></g>
    <g font-size="15" fill="#334155"><text x="102" y="164">совпадает</text><text x="253" y="164">совпадает</text><text x="404" y="164">совпадает</text><text x="555" y="164">совпадает</text><text x="721" y="164">невозможно</text></g>
  </g>
  <text x="33" y="221" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">Ищем последнюю допустимую длину: ответ 3.</text>
</svg>
